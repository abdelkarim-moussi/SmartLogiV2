services:
  db:
    image: postgres:17
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=moussi@25
      - POSTGRES_DB=smartLogiV2_db
    ports:
      - "5433:5432"

  app:
    build:
      context: .
    image: "smartlogi-v2"
    container_name: smartlogi-v2-app
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/smartLogiV2_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=moussi@25
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"